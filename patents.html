<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifacts Inventory // Mukilan K</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="home-styles.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="model-data.js"></script>
    <style>
        .rpg-container {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        .left-panel .nav-item {
            text-decoration: none;
        }
        .artifacts-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        .artifacts-row-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .art-icon-card {
            background: rgba(11,22,50,0.4);
            border: 1.5px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .art-icon-card:hover, .art-icon-card.active {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transform: scale(1.05);
        }
        .art-emoji {
            font-size: 1.5rem;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }
        .art-slot-lbl {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            display: block;
        }
        .art-detail-panel {
            background: rgba(11,22,50,0.3);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .art-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .art-slot-title {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }
        .art-main-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin: 4px 0;
        }
        .art-stars {
            color: #f59e0b;
            font-size: 0.95rem;
        }
        .art-main-stat-box {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }
        .art-main-stat-lbl {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }
        .art-main-stat-val {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }
        .art-sub-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--neon-cyan);
            margin: 15px 0 8px 0;
            text-transform: uppercase;
        }
        .art-substats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .art-substat-item {
            font-size: 0.82rem;
            color: var(--text-sub);
        }
        .art-substat-val {
            color: #ffffff;
            font-weight: 600;
            margin-left: 3px;
        }
        .art-set-bonus {
            border-left: 2px solid var(--neon-violet);
            padding-left: 10px;
            background: rgba(168,85,247,0.04);
            padding: 8px 10px;
            border-radius: 0 6px 6px 0;
        }
        .art-set-title {
            font-weight: 700;
            color: var(--neon-violet);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .art-set-desc {
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-sub);
            margin: 2px 0;
        }
    </style>
</head>
<body class="dark-mode instant-bypass">
    <canvas id="neural-canvas"></canvas>
    <div class="bg-circles"></div>
    <div class="bg-dust"></div>
    <div class="glow-vignette"></div>

    <div class="rpg-container">
        <!-- ── HEADER TOP BAR ── -->
        <header id="top-bar">
            <div class="profile-header-left">
                <div class="element-core-logo">
                    <div class="element-icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 12h9l-1 10 10-10h-9l1-10z" fill="var(--neon-cyan)"/>
                        </svg>
                    </div>
                </div>
                <div class="profile-title-block">
                    <div class="header-pre-title">AI Core / Mukilan K</div>
                    <h1 class="header-name">MUKILAN K</h1>
                </div>
            </div>
            
            <div class="profile-header-right">
                <a href="mukilan-k-resume.pdf" download class="action-icon-btn" title="Download Resume">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                </a>
                <a href="https://github.com/MUKILAN-K" target="_blank" class="action-icon-btn" title="GitHub">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                </a>
                <a href="https://www.linkedin.com/in/mukilan-k-ai/" target="_blank" class="action-icon-btn" title="LinkedIn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
                </a>
                <a href="https://huggingface.co/mukilan-k" target="_blank" class="action-icon-btn" title="Hugging Face">
                    <span style="font-size: 1.15rem; line-height: 1; display: inline-block; vertical-align: middle;">🤗</span>
                </a>
                <button id="theme-toggle" class="action-icon-btn" title="Switch Theme">
                    <span class="mode-icon-sun">☀️</span>
                    <span class="mode-icon-moon">🌙</span>
                </button>
            </div>
        </header>

        <!-- ── MAIN CONTENT GRID ── -->
        <div class="rpg-grid">
            <!-- LEFT PANEL: Navigation Links -->
            <nav class="panel left-panel">
                <a href="about.html" class="nav-item">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Attributes</span>
                    </div>
                </a>
                <a href="skills.html" class="nav-item">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Weapons</span>
                    </div>
                </a>
                <a href="patents.html" class="nav-item active">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Artifacts</span>
                    </div>
                </a>
                <a href="projects.html" class="nav-item">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Constellation</span>
                    </div>
                </a>
                <a href="achievements.html" class="nav-item">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Talents</span>
                    </div>
                </a>
                <a href="profile.html" class="nav-item">
                    <span class="nav-item-active-bar"></span>
                    <div class="nav-text">
                        <span class="nav-title">◈ Profile</span>
                    </div>
                </a>
            </nav>

            <!-- CENTER PANEL: Character model -->
            <div class="center-panel">
                <div class="robot-stage">
                    <div class="companion-robot-wrapper">
                        <div class="companion-robot-img-container">
                            <model-viewer 
                                id="mascot-3d-model"
                                src="sandrone_rigged_free.glb" 
                                alt="3D Rigged Character" 
                                auto-rotate 
                                camera-controls 
                                ar 
                                shadow-intensity="1.8"
                                interaction-prompt="none"
                                autoplay
                                style="width: 100%; height: 100%; background: transparent;">
                            </model-viewer>
                        </div>
                    </div>
                    
                    <div class="robot-landing-pad">
                        <div class="pad-ring pad-outer"></div>
                        <div class="pad-ring pad-middle"></div>
                        <div class="pad-ring pad-inner"></div>
                        <div class="pad-crosshair"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Detailed stats -->
            <main class="panel right-panel" style="overflow-y: auto;">
                <div class="artifacts-layout">
                    <!-- Artifact Selector Grid -->
                    <div class="artifacts-row-grid">
                        <div class="art-icon-card active" onclick="selectArtifact('flower')">
                            <div class="art-emoji">🌸</div>
                            <span class="art-slot-lbl">FLOWER</span>
                        </div>
                        <div class="art-icon-card" onclick="selectArtifact('plume')">
                            <div class="art-emoji">🪶</div>
                            <span class="art-slot-lbl">PLUME</span>
                        </div>
                        <div class="art-icon-card" onclick="selectArtifact('sands')">
                            <div class="art-emoji">⏳</div>
                            <span class="art-slot-lbl">SANDS</span>
                        </div>
                        <div class="art-icon-card" onclick="selectArtifact('goblet')">
                            <div class="art-emoji">🏆</div>
                            <span class="art-slot-lbl">GOBLET</span>
                        </div>
                        <div class="art-icon-card" onclick="selectArtifact('circlet')">
                            <div class="art-emoji">👑</div>
                            <span class="art-slot-lbl">CIRCLET</span>
                        </div>
                    </div>

                    <!-- Details Card -->
                    <div class="art-detail-panel" id="details-card">
                        <!-- Filled dynamically -->
                    </div>
                </div>
            </main>
        </div>

        <!-- ── BOTTOM STATUS BAR & PRIMARY CTA ── -->
        <footer id="bottom-bar">
            <div class="bottom-left-decor">
                <span class="decor-line-title">ENGINEERING INTELLIGENCE</span>
                <span class="decor-line-sub">SYS_STATUS: READY // DB_GRID_LINK: ESTABLISHED</span>
            </div>
            
            <div class="bottom-center-scroll" style="visibility: hidden;">
                <span class="scroll-mouse-icon">🖱️</span>
                <span class="scroll-label">SCROLL</span>
            </div>

            <div class="bottom-right-cta">
                <a href="index.html?bypass=true" class="enter-realm-cta" style="text-decoration: none; display: flex; align-items: center; justify-content: center; height: 100%;">
                    <div class="cta-inner-content">
                        <div class="cta-text-block">
                            <span class="cta-title-main">BACK TO CHAMBER</span>
                            <span class="cta-sub-main">Exit Active View ◈</span>
                        </div>
                    </div>
                </a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="home-script.js"></script>
    <script>
        const ARTIFACT_DATA = {
            flower: {
                slot: "Flower of Life",
                title: "Solar Purifier Brooch",
                mainLbl: "HP",
                mainVal: "+4,780",
                stars: "✦✦✦✦✦",
                substats: [
                    { name: "IoT Integration", val: "+12.4%" },
                    { name: "Blockchain Security", val: "+18.2%" },
                    { name: "Device Efficiency", val: "+8.5%" },
                    { name: "Carbon Defense", val: "+45" }
                ],
                patentRef: "Design Patent: Solar Wearable Purifier Array"
            },
            plume: {
                slot: "Plume of Death",
                title: "Smart SOS Transmitter",
                mainLbl: "ATK",
                mainVal: "+311",
                stars: "✦✦✦✦✦",
                substats: [
                    { name: "Voice Trigger Response", val: "+22.4%" },
                    { name: "GPS Coordinate Accuracy", val: "+14.6%" },
                    { name: "Low Power Consumption", val: "+9.2%" },
                    { name: "Sensor Telemetry", val: "+18" }
                ],
                patentRef: "Design Patent: Wearable Rescue SOS Watch"
            },
            sands: {
                slot: "Sands of Eon",
                title: "IoT Sands of Time",
                mainLbl: "Energy Recharge",
                mainVal: "+51.8%",
                stars: "✦✦✦✦✦",
                substats: [
                    { name: "ESP32 Handshakes", val: "+15%" },
                    { name: "Data Aggregation", val: "+10.2%" },
                    { name: "Power Saving Modes", val: "+12.5%" },
                    { name: "CRIT Rate", val: "+3.1%" }
                ],
                patentRef: "Utility Patents: 11 Registered Inventions"
            },
            goblet: {
                slot: "Goblet of Eonothem",
                title: "Edge Telemetry Flask",
                mainLbl: "AI Telemetry DMG Bonus",
                mainVal: "+46.6%",
                stars: "✦✦✦✦✦",
                substats: [
                    { name: "Tensorflow Regressions", val: "+14%" },
                    { name: "Cloud Sync Speed", val: "+18.5%" },
                    { name: "API Response Time", val: "+6.8%" },
                    { name: "Intellectual Expansion", val: "+16" }
                ],
                patentRef: "Utility Patents: 11 Registered Inventions"
            },
            circlet: {
                slot: "Circlet of Logos",
                title: "Intellectual Diadem",
                mainLbl: "CRIT Rate",
                mainVal: "+31.1%",
                stars: "✦✦✦✦✦",
                substats: [
                    { name: "IP Defensive Armor", val: "+24.5%" },
                    { name: "Drafting Precision", val: "+18%" },
                    { name: "WIPO Publications", val: "+11" },
                    { name: "Patent Coverage", val: "+14%" }
                ],
                patentRef: "Utility Patents: 11 Registered Inventions"
            }
        };

        function selectArtifact(key) {
            document.querySelectorAll('.art-icon-card').forEach(el => el.classList.remove('active'));
            
            const cards = document.querySelectorAll('.art-icon-card');
            for(let card of cards) {
                if(card.getAttribute('onclick').includes(key)) {
                    card.classList.add('active');
                }
            }

            const data = ARTIFACT_DATA[key];
            let substatsHtml = '';
            data.substats.forEach(s => {
                substatsHtml += `
                    <div class="art-substat-item">
                        ◈ ${s.name} <span class="art-substat-val">${s.val}</span>
                    </div>
                `;
            });

            const content = `
                <div class="art-header">
                    <span class="art-slot-title">${data.slot}</span>
                    <h3 class="art-main-title">${data.title}</h3>
                    <div class="art-stars">${data.stars}</div>
                    
                    <div class="art-main-stat-box">
                        <span class="art-main-stat-lbl">${data.mainLbl}</span>
                        <span class="art-main-stat-val">${data.mainVal}</span>
                    </div>
                </div>

                <div class="art-sub-title">Patent Link</div>
                <p class="wd-desc" style="color: var(--neon-cyan); font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600;">
                    ${data.patentRef}
                </p>

                <div class="art-sub-title">Substats</div>
                <div class="art-substats-grid">
                    ${substatsHtml}
                </div>

                <div class="art-set-bonus">
                    <div class="art-set-title">Inventor Guild Set</div>
                    <div class="art-set-desc" style="color: var(--neon-violet); font-weight: 600;">
                        2-Piece Set: Increases research compilation speed by 20%.
                    </div>
                    <div class="art-set-desc">
                        4-Piece Set: Grants a permanent 'Patent Shield', blocking intellectual litigation copy cycles and scaling recruiter affinity stats by 40%.
                    </div>
                </div>
            `;
            document.getElementById('details-card').innerHTML = content;
        }

        // Setup base64 3D loader
        document.addEventListener('DOMContentLoaded', () => {
            selectArtifact('flower');
            const viewer = document.getElementById('mascot-3d-model');
            if (viewer && typeof MODEL_BASE64 !== 'undefined') {
                try {
                    const parts = MODEL_BASE64.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const base64Data = parts[1];
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], {type: mime});
                    const blobUrl = URL.createObjectURL(blob);
                    viewer.src = blobUrl;
                } catch (e) {
                    viewer.src = "sandrone_rigged_free.glb";
                }
            }
        });
    </script>
</body>
</html>
