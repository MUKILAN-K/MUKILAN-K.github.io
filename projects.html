    <style>
        .rpg-container {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        .left-panel .nav-item {
            text-decoration: none;
        }
        .constellation-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        .const-canvas-wrapper {
            position: relative;
            height: 240px;
            background: rgba(11, 22, 50, 0.4);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .const-sky {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .const-star {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffffff;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease;
            box-shadow: 0 0 8px var(--neon-cyan);
        }
        .const-star:hover, .const-star.active {
            box-shadow: 0 0 20px #ffffff, 0 0 10px var(--neon-cyan);
            background: var(--neon-cyan);
            transform: translate(-50%, -50%) scale(1.25);
        }
        .const-star-lbl {
            position: absolute;
            color: var(--neon-cyan);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            white-space: nowrap;
            transform: translate(-50%, 12px);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
            pointer-events: none;
        }
        /* Star Coordinates inside right panel canvas */
        #s1 { top: 75%; left: 15%; }
        #s2 { top: 48%; left: 35%; }
        #s3 { top: 22%; left: 22%; }
        #s4 { top: 28%; left: 68%; }
        #s5 { top: 56%; left: 78%; }
        #s6 { top: 78%; left: 54%; }

        .const-detail-panel {
            background: rgba(11,22,50,0.3);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .cd-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .cd-lvl {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }
        .cd-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin: 4px 0;
        }
        .cd-tag {
            background: rgba(168, 85, 247, 0.15);
            color: var(--neon-violet);
            border: 1px solid var(--neon-violet);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }
        .cd-section-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .cd-desc {
            font-size: 0.86rem;
            line-height: 1.5;
            color: var(--text-sub);
            margin: 0 0 15px 0;
        }
        .cd-tech-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .cd-tech-tag {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .cd-unlock-badge {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }
    </style>
</head>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="home-script.js"></script>
    <script>
        const PROJECT_DATA = {
            1: {
                cNum: "Constellation Level 1",
                title: "Track Inspection Mini-Robot",
                tag: "Autonomous Systems",
                desc: "A solar-powered autonomous mini-robot engineered to detect railway track cracks. Uses IoT telemetry interfaces and custom microcontrollers to capture grid data locally and raise safety alerts.",
                tech: ["Arduino", "Sensor Arrays", "Solar Tracking", "IoT Telemetry"],
                unlocked: "UNLOCKED // SYSTEM DEPLOYED"
            },
            2: {
                cNum: "Constellation Level 2",
                title: "RescueWist Smart SOS Wearable",
                tag: "IoT & Public Safety",
                desc: "An intelligent, voice-triggered SOS wearable safety bracelet. Employs speech recognition modules and sensor integration to automatically capture distress signals and transmit location beacons.",
                tech: ["Speech Recognition", "GPS Module", "ESP32", "LiPo Circuits"],
                unlocked: "UNLOCKED // INTELLECT DEPLOYED"
            },
            3: {
                cNum: "Constellation Level 3",
                title: "Zentra Retail SaaS Portal",
                tag: "Enterprise Software",
                desc: "A multi-branch, high-throughput retail management software designed as a scalable SaaS. Integrates real-time inventory triggers, branch metrics, and cloud analytics.",
                tech: ["Cloud Database", "SaaS Architecture", "Analytics API", "React"],
                unlocked: "UNLOCKED // PORTAL COMPILED"
            },
            4: {
                cNum: "Constellation Level 4",
                title: "CarzNow Vehicle DBMS",
                tag: "Data Architectures",
                desc: "A robust relational Database Management System designed for large-scale car rental administration. Features optimized queries, ACID transactions, and modular control blocks.",
                tech: ["SQL Server", "DBMS Design", "ACID Modules", "Relational Indexes"],
                unlocked: "UNLOCKED // DB LEDGER MOUNTED"
            },
            5: {
                cNum: "Constellation Level 5",
                title: "Blockchain Solar Air Purifier",
                tag: "CleanTech & Web3",
                desc: "A decentralized, solar-powered air purification unit integrated with blockchain technology. Tracks particulate filtration data and posts metrics to a public ledger.",
                tech: ["Blockchain API", "Particulate Sensor", "Solar Tracking", "IPFS Node"],
                unlocked: "UNLOCKED // MSME PRODUCT NODE"
            },
            6: {
                cNum: "Constellation Level 6",
                title: "BioRespira Spirulina Tower",
                tag: "BioTelemetry Systems",
                desc: "An innovative biochemical filter tower utilizing Spirulina microalgae arrays to absorb airborne pollutants and generate clean oxygen, monitored via ESP sensor nodes.",
                tech: ["Bioreactor Cells", "ESP32-CAM", "Oxygen Telemetry", "CleanTech"],
                unlocked: "UNLOCKED // MAX CONSTELLATION NODE"
            }
        };

        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawConnections();
        }

        function drawConnections() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const getPos = (id) => {
                const el = document.getElementById(id);
                if (!el) return null;
                const parentRect = el.parentElement.getBoundingClientRect();
                const rect = el.getBoundingClientRect();
                return {
                    x: rect.left - parentRect.left + rect.width/2,
                    y: rect.top - parentRect.top + rect.height/2
                };
            };

            const p1 = getPos('s1');
            const p2 = getPos('s2');
            const p3 = getPos('s3');
            const p4 = getPos('s4');
            const p5 = getPos('s5');
            const p6 = getPos('s6');

            if (!p1 || !p2 || !p3 || !p4 || !p5 || !p6) return;

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.lineTo(p5.x, p5.y);
            ctx.lineTo(p6.x, p6.y);
            ctx.lineTo(p1.x, p1.y); 
            
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.stroke();

            // Highlight ring around active
            const activeNode = document.querySelector('.const-star.active');
            if (activeNode) {
                const actPos = getPos(activeNode.id);
                ctx.beginPath();
                ctx.arc(actPos.x, actPos.y, 25, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.fillStyle = 'rgba(0, 240, 255, 0.04)';
                ctx.lineWidth = 1;
                ctx.setLineDash([]);
                ctx.fill();
                ctx.stroke();
            }
        }

        function selectConstellation(num) {
            document.querySelectorAll('.const-star').forEach(el => el.classList.remove('active'));
            document.getElementById(`s${num}`).classList.add('active');

            const data = PROJECT_DATA[num];
            let techHtml = '';
            data.tech.forEach(t => {
                techHtml += `<span class="cd-tech-tag">${t}</span>`;
            });

            const content = `
                <div class="cd-header">
                    <span class="cd-lvl">${data.cNum}</span>
                    <h3 class="cd-title">${data.title}</h3>
                    <span class="cd-tag">${data.tag}</span>
                </div>

                <div class="cd-section-title">Core Parameters</div>
                <p class="cd-desc">${data.desc}</p>

                <div class="cd-section-title">Engines & Tech</div>
                <div class="cd-tech-list">
                    ${techHtml}
                </div>

                <div style="margin-top: 15px;">
                    <div class="cd-unlock-badge">
                        <span>⚡</span> ${data.unlocked}
                    </div>
                </div>
            `;
            document.getElementById('details-card').innerHTML = content;
            drawConnections();
        }

        window.addEventListener('resize', resizeCanvas);
        
        // Setup base64 3D loader
        document.addEventListener('DOMContentLoaded', () => {
            selectConstellation(1);
            setTimeout(resizeCanvas, 300);
            
            const viewer = document.getElementById('mascot-3d-model');
            if (viewer && typeof MODEL_BASE64 !== 'undefined') {
                try {
                    const parts = MODEL_BASE64.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const base64Data = parts[1];
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], {type: mime});
                    const blobUrl = URL.createObjectURL(blob);
                    viewer.src = blobUrl;
                } catch (e) {
                    viewer.src = "sandrone_rigged_free.glb";
                }
            }
        });
    </script>
